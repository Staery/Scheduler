name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Scheduler.sln

      - name: Build
        run: dotnet build Scheduler.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Scheduler.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx" --collect "XPlat Code Coverage"

      - name: Publish app
        run: >
          dotnet publish src/Scheduler/Scheduler.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: Scheduler-win-x64
          path: publish/

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Scheduler-win-x64
          path: Scheduler

      - name: Package
        run: zip -r Scheduler-${{ github.ref_name }}-win-x64.zip Scheduler

      - uses: softprops/action-gh-release@v2
        with:
          files: Scheduler-*.zip
          generate_release_notes: true
